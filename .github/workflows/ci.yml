name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10.x, 3.11.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create mock data
      run: |
        mkdir -p data
        echo "station_id,timestamp,latitude,longitude,elevation,azimuth,zenith_wet_delay" > data/mock_gnss_zwd.csv
        echo "TEST001,2024-01-01T00:00:00Z,40.0,-74.0,100.0,180.0,0.250" >> data/mock_gnss_zwd.csv
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest tests/ -v --tb=short
    
    - name: Run backend linting
      run: |
        cd backend
        pip install flake8 black
        flake8 app/ --max-line-length=100 --ignore=E203,W503
        black --check app/ --line-length=100

  test-ml:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-ml-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-ml-pip-
    
    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install jupyter matplotlib seaborn
    
    - name: Create mock data for ML
      run: |
        mkdir -p data ml/models
        echo "station_id,timestamp,latitude,longitude,elevation,azimuth,zenith_wet_delay" > data/mock_gnss_zwd.csv
        for i in {1..5}; do
          for h in {0..23}; do
            echo "GNSS00$i,2024-01-01T$(printf %02d $h):00:00Z,$((40+i)),$((70+i)),100.0,180.0,0.25" >> data/mock_gnss_zwd.csv
          done
        done
    
    - name: Test ML training script
      run: |
        cd ml
        python train.py
        ls -la models/
    
    - name: Test ML prediction script
      run: |
        cd ml
        python predict.py
    
    - name: Validate notebook
      run: |
        cd ml/notebooks
        jupyter nbconvert --to notebook --execute gnss_ml_demo.ipynb --ExecutePreprocessor.timeout=300

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install
    
    - name: Run frontend linting
      run: |
        cd frontend
        pnpm lint
    
    - name: Build frontend
      run: |
        cd frontend
        pnpm build
    
    - name: Run frontend type check
      run: |
        cd frontend
        pnpm exec tsc --noEmit

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-backend, test-ml, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create mock data
      run: |
        mkdir -p data
        echo "station_id,timestamp,latitude,longitude,elevation,azimuth,zenith_wet_delay" > data/mock_gnss_zwd.csv
        for i in {1..5}; do
          for h in {0..23}; do
            echo "GNSS00$i,2024-01-01T$(printf %02d $h):00:00Z,$((40+i)),$((70+i)),100.0,180.0,0.25" >> data/mock_gnss_zwd.csv
          done
        done
        
        echo "station_id,timestamp,latitude,longitude,elevation,observed_wet_delay,pw_measurement,source" > data/mock_validation_wetdelay.csv
        echo "VAL001,2024-01-01T12:00:00Z,40.7000,-74.0100,12.5,0.243,24.0,radiosondes" >> data/mock_validation_wetdelay.csv
    
    - name: Build and test with Docker Compose
      run: |
        docker-compose -f docker-compose.yml build
        docker-compose -f docker-compose.yml up -d
        sleep 30
        
        # Test backend health
        curl -f http://localhost:8000/health
        
        # Test API endpoints
        curl -f http://localhost:8000/api/stations
        curl -f http://localhost:8000/api/demo-data
        
        # Test frontend (basic check)
        curl -f http://localhost:3000 | grep -q "GNSS"
        
        docker-compose -f docker-compose.yml down

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # For example: deploy to Render, Heroku, or your staging server
    
  deploy-production:
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
