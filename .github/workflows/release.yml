name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## GNSS Tropospheric PW Interpolator Release
          
          ### Features
          - Real-time GNSS precipitable water interpolation
          - Machine learning models (GPR, IDW, LSTM)
          - Interactive web dashboard
          - Validation against reference data
          - Forecasting capabilities
          - Docker containerization
          
          ### Installation
          ```bash
          git clone https://github.com/your-username/gnss-dashboard.git
          cd gnss-dashboard
          docker-compose up --build
          ```
          
          ### Usage
          Open http://localhost:3000 in your browser to access the dashboard.
          
          See README.md for detailed instructions.
        draft: false
        prerelease: false

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          your-dockerhub-username/gnss-dashboard-backend
          your-dockerhub-username/gnss-dashboard-frontend
        tags: |
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: your-dockerhub-username/gnss-dashboard-backend:${{ github.ref_name }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: your-dockerhub-username/gnss-dashboard-frontend:${{ github.ref_name }}
        labels: ${{ steps.meta.outputs.labels }}
